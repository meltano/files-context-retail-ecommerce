title: "Retail and e-commerce: handling the data"
questions: What care does retail and e-commerce data need in the warehouse?
description: |
  Retail and e-commerce data is mostly about customers: who they are, what they buy, where it is
  delivered and what they agreed to receive. These are general practices for a warehouse holding
  it. They are not legal or compliance advice: the organisation's legal or data protection team
  decides what applies to it.

  ## Classify the data

  | Class | Examples | Handling |
  |---|---|---|
  | Card data | Full card number (PAN), CVV, expiry with PAN | **Never load it into the warehouse.** Payment providers tokenise it: keep the token, card brand and at most the last four digits. Holding card data brings the warehouse into PCI DSS scope |
  | Contact and delivery data | Name, email, phone, billing and delivery addresses | Restrict access, mask in non-production and in marts that do not need it |
  | Behavioural data | Order history, browsing, device and cookie IDs, IP address | Personal data when linked to a person. Aggregate where possible |
  | Marketing consent | Email and SMS opt-in, unsubscribes, cookie consent | Keep it accurate and current: it decides who may be contacted |
  | Special category inferences | Purchases that reveal health, religion or similar | Avoid building segments that infer them |
  | Commercial data | Cost prices, margins, supplier terms | Restrict to trading and finance roles |

  ## Practices

  - **Least privilege.** Separate raw, staging and mart schemas, and grant raw schemas only to the
    pipelines and the people who maintain them.
  - **Mask by default.** Hash emails and phone numbers in shared marts (a hashed email still joins
    across sources), and give unmasked access by role.
  - **No production data in development** without masking.
  - **Consent travels with the audience.** An audience exported to Klaviyo, Meta or Google must
    respect the latest opt-in and unsubscribe status. Model consent as its own table with timestamps
    and source.
  - **Retention.** Keep order records as long as accounting and tax rules need them; keep marketing
    and behavioural data only as long as it is useful. Agree periods and model deletion explicitly.
  - **Data subject requests.** Under GDPR and UK GDPR a customer can ask for their data or for its
    erasure, so know where each person's data lives, including in exports to marketing tools.

  ## Rules to be aware of

  Which apply depends on the organisation's country and activities. Common ones:

  - **UK:** UK GDPR and the Data Protection Act 2018, PECR (consent for marketing email and SMS, and
    for cookies), the Consumer Contracts Regulations (cancellation and returns), the Information
    Commissioner's Office (ICO).
  - **EU:** GDPR, the ePrivacy Directive, consumer rights rules, the Digital Services Act for
    platforms and marketplaces.
  - **US:** state privacy laws such as the CCPA/CPRA, CAN-SPAM for email, the TCPA for SMS.
  - **Card payments everywhere:** PCI DSS.
  - **Tax:** VAT records, and marketplace rules that make the platform responsible for some VAT.

